spring.application.name=SpringAI
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

spring.ai.openai.api-key=${OPENAI_API_KEY:lm-studio}
spring.ai.openai.base-url=http://127.0.0.1:1234/v1
spring.ai.openai.embedding.base-url=http://127.0.0.1:1234/v1
spring.ai.openai.chat.model=gemma-4-e4b-it-mlx
spring.ai.openai.embedding.model=text-embedding-nomic-embed-text-v1.5

spring.docker.compose.stop.command=down

spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=my_collection